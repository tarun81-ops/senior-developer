[project]
name = "senior-developer-agents"
version = "0.1.0"
description = "Multi-agent software engineering system (orchestrator + specialist agents)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Tests import "backend...." so the repository root must be on sys.path.
pythonpath = ["."]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
