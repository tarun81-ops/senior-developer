# =============================================================================
# Agent registry: which model each agent uses, and in what fallback order.
# =============================================================================
# Each agent has a "routing" list. The router walks it top to bottom:
#   first entry  = first choice
#   later entries = automatic fallbacks when a provider is rate limited,
#                   out of daily quota, cooling down, or missing a key.
#
# The last entry of every chain should be an offline mock so that the system
# always has *something* to answer with while you are setting up keys.
# =============================================================================

agents:

  # Phase 1: the one real agent. Ask it anything from the command line.
  code:
    role: General-purpose software engineer used to smoke-test the provider layer.
    prompt_file: backend/core/agents/prompts/code.md
    temperature: 0.2
    max_output_tokens: 4096
    routing:
      - provider: gemini
        model: gemini-3.8-flash
      - provider: groq
        model: openai/gpt-oss-120b
      - provider: openrouter
        model: qwen/qwen3.8-27b:free
      - provider: mock
        model: mock-echo

  # Offline demonstration agent: the first provider always fails with 429, so
  # you can watch retries, backoff, cooldown and failover without spending a
  # single token of free quota.
  demo:
    role: Offline failover demonstration.
    prompt_file: backend/core/agents/prompts/demo.md
    temperature: 0.0
    max_output_tokens: 512
    routing:
      - provider: mock_flaky
        model: mock-echo
      - provider: mock
        model: mock-echo

# =============================================================================
# Phase 2 specialists — model assignment per role (decision D5):
#   planner / architect : Gemini Flash      -> long context window
#   coder               : Gemini Flash      -> writing files = large outputs
#   tester              : Groq gpt-oss      -> short, fast, deterministic output
#   reviewer            : OpenRouter first  -> a DIFFERENT model family on purpose:
#                                              a model reviewing its own work is
#                                              biased towards saying "looks good"
#   devops / docs       : Gemini Flash-Lite -> simple, high-volume tasks
# Every chain ends in the offline mock, so the pipeline always completes even
# with zero keys configured.
# =============================================================================

  planner:
    role: Turns a plain-English goal into an ordered implementation plan.
    prompt_file: backend/core/agents/prompts/planner.md
    temperature: 0.2
    max_output_tokens: 4096
    routing:
      - provider: gemini
        model: gemini-3.8-flash
      - provider: groq
        model: openai/gpt-oss-120b
      - provider: openrouter
        model: qwen/qwen3.8-27b:free
      - provider: mock
        model: mock-echo

  architect:
    role: Designs the module structure and data flow for the plan.
    prompt_file: backend/core/agents/prompts/architect.md
    temperature: 0.2
    max_output_tokens: 4096
    routing:
      - provider: gemini
        model: gemini-3.8-flash
      - provider: groq
        model: openai/gpt-oss-120b
      - provider: openrouter
        model: qwen/qwen3.8-27b:free
      - provider: mock
        model: mock-echo

  coder:
    role: Produces the complete file contents for the design.
    prompt_file: backend/core/agents/prompts/coder.md
    temperature: 0.2
    max_output_tokens: 8192
    routing:
      - provider: gemini
        model: gemini-3.8-flash
      - provider: groq
        model: qwen/qwen3.8-27b
      # LLM gateway (D-loop-fix): a third, independent vendor before the free
      # OpenRouter tier. Also the loop-detection target - a repeated error in
      # the fix loop forces the NEXT candidate here, not a retry of the same one.
      - provider: cerebras
        model: llama-3.3-70b
      - provider: openrouter
        model: qwen/qwen3.8-27b:free
      - provider: mock
        model: mock-echo

  tester:
    role: Writes the test suite and states how to run it.
    prompt_file: backend/core/agents/prompts/tester.md
    temperature: 0.0
    max_output_tokens: 4096
    routing:
      - provider: groq
        model: openai/gpt-oss-120b
      - provider: gemini
        model: gemini-3.8-flash
      - provider: mock
        model: mock-echo

  reviewer:
    role: Independent review from a different model family; emits approve or changes_requested.
    prompt_file: backend/core/agents/prompts/reviewer.md
    temperature: 0.0
    # 8192, not 4096: the first-choice free reviewer is a "thinking" model, and
    # a truncated budget yields an empty content field (see router empty guard).
    max_output_tokens: 8192
    routing:
      - provider: openrouter
        model: qwen/qwen3.8-27b:free
      - provider: openrouter
        model: z-ai/glm-5.2:free
      - provider: cerebras
        model: llama-3.3-70b
      - provider: gemini
        model: gemini-3.8-flash
      - provider: mock
        model: mock-echo

  devops:
    role: Produces deployment, configuration and CI files.
    prompt_file: backend/core/agents/prompts/devops.md
    temperature: 0.1
    max_output_tokens: 4096
    routing:
      - provider: gemini
        model: gemini-2.5-flash-lite
      - provider: gemini
        model: gemini-3.8-flash
      - provider: mock
        model: mock-echo

  docs:
    role: Produces the README and user documentation.
    prompt_file: backend/core/agents/prompts/docs.md
    temperature: 0.3
    max_output_tokens: 6144
    routing:
      - provider: gemini
        model: gemini-2.5-flash-lite
      - provider: gemini
        model: gemini-3.8-flash
      - provider: mock
        model: mock-echo

# ==============================================================================
# Pipeline (D-loop-fix): stage order and loop policy.
#   small task (triage):  coder -> auto-checks -> done
#   medium/large:         planner -> architect -> coder -> tester
#                            -> auto-checks (py_compile, ruff, pytest; exact
#                               error back to the coder as a minimal patch, up
#                               to max_autocheck_iterations)
#                            -> reviewer
#                            -> (a BLOCKER: coder fixes, reviewer re-checks,
#                               up to max_review_iterations)
#                            -> devops -> docs
# Either loop running out of tries escalates to a human with the code and the
# exact error attached, instead of just reporting "failed".
# A stage name must also be an agent defined above.
# ==============================================================================
pipeline:
  stages: [planner, architect, coder, tester, reviewer, devops, docs]
  # classify the goal before spending a call; small tasks use the fast lane
  triage: true
  max_autocheck_iterations: 3
  max_review_iterations: 2
  # Phase 3: write the stages' `files` into workspace/<project>/ and run the
  # auto-check gate. Turn off with --no-apply / --no-run-tests.
  apply_workspace: true
  run_tests: true
